# aaltocam example tool library -- Wegstr CNC with LPKF and Wegstr cutters
#
# The cutters one real Wegstr setup runs with. Point aaltoCAM at this file with
#     AALTOCAM_TOOLS=<path to this file>
# or copy it over tools.toml in your config directory (%APPDATA%\aaltocam on
# Windows, ~/.config/aaltocam elsewhere).
#
# Five tools carry feeds measured on boards actually cut on that machine:
# lpkf-rf-0.15 (isolation), lpkf-end-1.0 (hole milling), router-1.0 (cutout),
# drill-0.7 (drilling) and, geometry only, wegstr-vbit-30. Everything else has
# geometry and zero feeds, which means "not established yet": a CNC job then
# uses its own feed fields and says so in a warning.
#
# feed_xy, feed_z   mm/min. Zero means not established yet.
# cut_z             mm, negative. depth_per_pass mm, positive, 0 = single pass.
# spindle_rpm       advisory. A Wegstr ignores S entirely and is set by hand;
#                   this is written as a comment at the tool change and used for
#                   the chip-load figure. 11000 rpm is what that machine runs.
# flutes            assumed unless checked. Chip load scales inversely with it.
# kind              mill | endmill | router | drill | vbit
# vendor, part_number
#                   for reordering; aaltoCAM ignores keys it does not know.
#
# Order matters: when two tools share a diameter, the diameter lookup used by
# drilling and rest machining picks the LAST one, so the drills stay at the end.

[[tool]]
id = "lpkf-micro-0.1"
name = "LPKF Micro Cutter 0.1"
kind = "vbit"
diameter = 0.1
flutes = 1
tip_angle = 0.0
tip_diameter = 0.1
feed_xy = 0.0
feed_z = 0.0
cut_z = 0.0
depth_per_pass = 0.0
spindle_rpm = 11000
notes = "Tip width assumed from the product name; measure a test groove and correct tip_diameter. tip_angle 0 = unknown, aaltoCAM then assumes 30 deg."
source = ""
vendor = "LPKF"
part_number = "115836"

