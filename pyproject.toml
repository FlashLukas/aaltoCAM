[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaltocam"
version = "0.14.0"
description = "Parametric CAM for PCB isolation milling"
requires-python = ">=3.11"
dependencies = [
    "gerbonara>=1.5",
    "shapely>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
aaltocam = "aaltocam.cli:main"
aaltocam-gui = "aaltocam.gui.app:main"

[tool.setuptools.package-data]
"aaltocam.gui" = ["*.ico", "*.png"]

[tool.setuptools.packages.find]
include = ["aaltocam*"]
